<DOCTYPE html>
<html lang="es">
    <head>
        <title>Ejercicio 3</title>
        <meta charset="UTF-8"/>
        <link rel="stylesheet" href="css/estiloEjercicio3.css"/>
    </head>
    
    <body>
        <main>  
           
            <table class="tabla1">
                <caption><em>Tabla prueba 1</em></caption>
                <th>columna 1</th>
                <th>columna 2</th>
                <th>columna 3</th>
                <th>columna 4</th>
                <tr>
                    <td class="td1">col 1</td>
                    <td colspan="2" class="td1">col 2</td>
                    <!-- lo completa la col 2-->
                    <td rowspan="2" class="td1">col 3</td> 
                </tr>
                <tr>
                    <td class="td1">colum 1</td>
                    <td class="td1">colum 2</td>
                    <td class="td1">colum 3</td>
                    <!--lo completa columna 3-->
                </tr>
            </table>
            <br>
            
            
             <table class="tabla2">
                <caption><em>Tabla prueba 2</em></caption>
                <tr class="gris">
                <th class="th2">columna 1</th>
                <th class="th2">columna 2</th>
                <th class="th2">columna 3</th>
                <th class="th2">columna 4</th>
                </tr>
                <tr class="verde">
                    <td>col 1</td>
                    <td colspan="2">col 2</td>
                    <!-- lo completa la col 2-->
                    <td>col 3</td> 
                </tr>
                <tr class="gris">
                    <td>colum 1</td>
                    <td rowspan="2">colum 2</td>
                    <td>colum 3</td>
                    <td>colum 4</td>
                </tr>
                <tr class="verde">
                    <td>column 1</td>
                    <!-- lo completa colum 2-->
                    <td>colum 3</td>
                    <td>colum 4</td>
                </tr>
                <tr class="gris">
                    <td>colu 1</td>
                    <td>colu 2</td>
                    <td>colu 3</td>
                    <td>colu 4</td>
                </tr>
            </table>
        </main>
        
</body>
</html>
